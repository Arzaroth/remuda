<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>remuda</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
try {
  const t = localStorage.getItem("remuda-theme");
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
} catch {}
</script>
<style>
:root {
  color-scheme: light dark;
  --paper: light-dark(#f5f4f0, #18191b); --surface: light-dark(#fbfbf9, #202124);
  --sunk: light-dark(#eeede8, #26272a); --ink: light-dark(#1f2328, #e8e8e6);
  --muted: light-dark(#6b6f76, #9a9ca1); --rule: light-dark(#e4e2dc, #2e3033);
  --good: light-dark(#2f8a5f, #45b884); --warn: light-dark(#b7821a, #d9a63a);
  --bad: light-dark(#bf3a2c, #e5675c); --track: light-dark(#e6e4de, #323438);
  --press: light-dark(#1f2328, #e8e8e6); --press-ink: light-dark(#fbfbf9, #18191b);
  --focus: light-dark(#3b6fd8, #7aa2f7);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  font-variant-numeric: tabular-nums; }
main { max-width: 1120px; margin: 0 auto; padding: 28px 16px 72px; }
code, .spec { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
h1 { font-size: 22px; font-weight: 750; letter-spacing: -0.02em; margin: 0; }
.brand span { color: var(--muted); }

.health { margin: 14px 0 26px; color: var(--muted); font-size: 13px; }
.health-line { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.health-line > div { display: flex; align-items: baseline; gap: 7px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; transform: translateY(-1px); }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.health a { color: var(--focus); }
.linkish { border: 0; background: none; padding: 0; color: var(--ink); cursor: pointer; text-decoration: underline;
  text-decoration-color: var(--rule); text-underline-offset: 3px; }
.linkish:hover { text-decoration-color: currentColor; }
.problems { margin: 10px 0 0; padding: 10px 14px 10px 30px; border-radius: 10px; background: var(--sunk); color: var(--ink); }
.problems li + li { margin-top: 4px; }

.theme { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--rule); border-radius: 9px; background: var(--surface); }
.theme button { border: 0; background: none; height: 26px; padding: 0 10px; border-radius: 7px; cursor: pointer; color: var(--muted); }
.theme button[aria-pressed="true"] { background: var(--sunk); color: var(--ink); font-weight: 600; }
.top-actions { display: flex; gap: 10px; align-items: center; }

.picks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; }
.picks button { border: 1px solid var(--rule); background: none; border-radius: 13px; height: 24px; padding: 0 10px;
  font-size: 12px; color: var(--muted); cursor: pointer; }
.picks button:hover { color: var(--ink); }
.picks button[aria-pressed="true"] { background: var(--press); border-color: var(--press); color: var(--press-ink); }

.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); background: var(--surface);
  border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
.tile { padding: 18px 20px 20px; border-left: 1px solid var(--rule); min-width: 0; }
.tile:first-child { border-left: 0; }
.tile-head { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
.tile-head b { color: var(--ink); font-weight: 650; }
.big { font-size: 38px; font-weight: 760; letter-spacing: -0.035em; line-height: 1.05; margin: 12px 0 10px; }
.big small { font-size: 14px; font-weight: 500; letter-spacing: 0; color: var(--muted); margin-left: 6px; }
.tile .under { color: var(--muted); font-size: 13px; margin-top: 8px; }

.meter { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.meter i { display: block; height: 100%; width: var(--w); border-radius: inherit; background: var(--good);
  animation: fill 0.7s cubic-bezier(.2,.7,.2,1) both; }
.meter.warn i { background: var(--warn); } .meter.bad i { background: var(--bad); }
.fresh .meter i { animation: none; }
@keyframes fill { from { width: 0; } }
@media (prefers-reduced-motion: reduce) { .meter i { animation: none; } }

.group { margin-top: 34px; }
.group-head { display: flex; align-items: baseline; gap: 10px; padding: 0 4px 10px; border-bottom: 1px solid var(--rule); }
h2 { font-size: 16px; font-weight: 700; margin: 0; }
.count { color: var(--muted); }
.row { display: grid; grid-template-columns: minmax(200px, 1.1fr) minmax(260px, 2fr) minmax(150px, 0.9fr) auto;
  gap: 12px 26px; align-items: center; padding: 16px 4px; border-bottom: 1px solid var(--rule); position: relative; }
.row.active::before { content: ""; position: absolute; left: -12px; top: 14px; bottom: 14px; width: 3px;
  border-radius: 2px; background: var(--good); }
.who { min-width: 0; }
.spec { font-weight: 650; font-size: 14px; overflow-wrap: anywhere; }
.who .label, .who .edit-label { margin-left: 8px; }
.who .label:empty { display: none; }
.who span.spec { line-height: 1; }
.editing { display: inline-flex; align-items: center; gap: 4px; vertical-align: top; max-width: 100%; height: 1.5em; }
.editing input { height: 1.5em; line-height: normal; padding: 0 4px; margin-left: -5px; border-radius: 5px;
  border-color: var(--focus); min-width: 8ch; max-width: 100%; field-sizing: content; }
.editing .spec { font-weight: 650; }
.editing .ok { height: 1.5em; width: 1.5em; padding: 0; border-radius: 5px; border: 0; cursor: pointer;
  display: inline-grid; place-items: center; background: var(--press); color: var(--press-ink); }
.editing .ok svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.btn.icon[aria-pressed="true"] { border-color: var(--ink); background: var(--sunk); }
.who .mail { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.pills { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.pill { font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: 10px; background: var(--sunk); color: var(--ink); }
.pill.on { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); font-weight: 600; }
.pill.odd { background: transparent; box-shadow: inset 0 0 0 1px var(--warn); color: var(--warn); }

.windows { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px 18px; min-width: 0; }
.win-head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 5px; }
.win-head span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.win-head b { font-weight: 650; }
.win .when { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; }
.aside { color: var(--muted); font-size: 13px; }

.tokens { display: grid; gap: 9px; font-size: 13px; }
.tokens .win-head { margin-bottom: 4px; }
.late { color: var(--bad); } .soon { color: var(--warn); }

.actions { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; height: 32px; padding: 0 12px;
  cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.go { background: var(--press); border-color: var(--press); color: var(--press-ink); font-weight: 600; }
.btn.go:disabled { background: transparent; border-color: var(--rule); color: var(--muted); }
.btn.icon { width: 32px; padding: 0; display: inline-grid; place-items: center; }
.btn.icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.btn.danger { color: var(--bad); }
.btn.armed { width: auto; padding: 0 10px; background: var(--bad); border-color: var(--bad); color: #fff; }

input, select { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; height: 34px; padding: 0 10px; min-width: 0; }
.inline { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.inline input { flex: 1 1 220px; }
.note { margin: 14px 4px 0; padding: 12px 14px; border-radius: 10px; background: var(--sunk); color: var(--ink); }
.note .inline { margin-top: 10px; }
.empty { color: var(--muted); padding: 16px 4px; }

.add { margin-top: 40px; padding: 20px; border: 1px dashed var(--rule); border-radius: 14px; }
.add h2 { margin-bottom: 4px; }
.add p { margin: 0 0 14px; color: var(--muted); }
.add form { display: flex; gap: 8px; flex-wrap: wrap; }
.add form input { flex: 0 1 260px; }
.signin { margin-top: 14px; display: grid; gap: 10px; }
.signin a { color: var(--focus); overflow-wrap: anywhere; }

#toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 8px); max-width: min(92vw, 640px);
  background: var(--press); color: var(--press-ink); padding: 10px 14px; border-radius: 10px;
  opacity: 0; pointer-events: none; transition: opacity 0.18s, transform 0.18s; white-space: pre-wrap; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.error { background: var(--bad); color: #fff; }

@media (max-width: 900px) {
  .row { grid-template-columns: 1fr auto; }
  .row > .usage, .row > .tokens { grid-column: 1 / -1; }
  .row > .actions { grid-row: 1; grid-column: 2; align-self: start; }
  .row.active::before { left: -8px; }
}
@media (max-width: 560px) {
  .row { grid-template-columns: 1fr; }
  .row > .actions { grid-row: auto; grid-column: 1; justify-content: flex-start; }
  .tile { border-left: 0; border-top: 1px solid var(--rule); }
  .tile:first-child { border-top: 0; }
}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand"><h1>remuda</h1><span>Logins on this machine</span></div>
    <div class="top-actions">
      <div class="theme" id="theme" role="group" aria-label="Theme">
        <button data-theme="auto">Auto</button><button data-theme="light">Light</button><button data-theme="dark">Dark</button>
      </div>
      <button class="btn" id="refresh-all" title="Refresh the inactive logins that expire within the hour">Refresh tokens</button>
    </div>
  </div>
  <div class="health" id="health"></div>
  <div id="strip"></div>
  <div id="providers"></div>
  <section class="add">
    <h2>Add an account</h2>
    <p>Sign in with the account in your browser and remuda stores it under the name you choose.</p>
    <form id="add">
      <select id="add-provider" aria-label="CLI"></select>
      <input id="add-name" placeholder="Name, e.g. work" required pattern="[A-Za-z0-9_][A-Za-z0-9._\-]*" aria-label="Name">
      <button class="btn go" type="submit">Sign in</button>
    </form>
    <div id="signin"></div>
  </section>
</main>
<div id="toast" role="status"></div>
<script>
"use strict";
const token = (() => {
  const fromHash = location.hash.slice(1);
  try {
    if (fromHash) sessionStorage.setItem("remuda-token", fromHash);
    return fromHash || sessionStorage.getItem("remuda-token") || "";
  } catch { return fromHash; }
})();
if (location.hash) history.replaceState(null, "", location.pathname);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);

const ICONS = {
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
  label: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>',
  rename: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
  remove: '<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/>',
  save: '<path d="m5 12.5 4.5 4.5L19 7"/>',
};
const icon = (name) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;

async function api(path, body) {
  const init = { headers: { "X-Remuda-Token": token } };
  if (body !== undefined) {
    init.method = "POST";
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(body);
  }
  const r = await fetch(path, init);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

let toastTimer;
function toast(message, error = false) {
  const t = $("toast");
  t.textContent = message;
  t.className = "show" + (error ? " error" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = error ? "error" : ""), error ? 7000 : 3500);
}

async function act(path, body) {
  try {
    const r = await api(path, body);
    if (r.message) toast(r.message);
  } catch (e) {
    toast(e.message, true);
  }
  await load();
}

const MIN = 60e3, HOUR = 60 * MIN, DAY = 24 * HOUR;
function span(ms) {
  const a = Math.abs(ms);
  if (a < MIN) return "under a minute";
  const [n, unit] = a < HOUR ? [Math.floor(a / MIN), "minute"] : a < DAY ? [Math.floor(a / HOUR), "hour"]
    : [Math.floor(a / DAY), "day"];
  return `${n} ${unit}${n === 1 ? "" : "s"}`;
}
const until = (ms) => ms < Date.now() ? `${span(ms - Date.now())} ago` : `in ${span(ms - Date.now())}`;
const ago = (ms) => `${span(Date.now() - ms)} ago`;
const date = (ms) => new Date(ms).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

function meter(fraction, tone) {
  const w = Math.max(0, Math.min(1, fraction)) * 100;
  return `<div class="meter ${tone}"><i style="--w:${w.toFixed(1)}%"></i></div>`;
}
const usedTone = (p) => p >= 90 ? "bad" : p >= 70 ? "warn" : "";

function windowCell(w) {
  const resets = w.resetsAt ? Date.parse(w.resetsAt) : null;
  const when = resets ? `<div class="when" title="${esc(date(resets))}">Resets ${esc(until(resets))}</div>`
    : '<div class="when">No reset pending</div>';
  return `<div class="win">
    <div class="win-head"><span title="${esc(w.title)}">${esc(w.title)}</span><b>${w.usedPercent}%</b></div>
    ${meter(w.usedPercent / 100, usedTone(w.usedPercent))}${when}</div>`;
}

function lifetime(title, at, horizon, warnBelow) {
  if (at == null) return "";
  const left = at - Date.now();
  const tone = left < 0 ? "bad" : left < warnBelow ? "warn" : "";
  const cls = left < 0 ? "late" : left < warnBelow ? "soon" : "";
  return `<div title="${esc(date(at))}">
    <div class="win-head"><span>${title}</span><b class="${cls}">${left < 0 ? "expired" : esc(span(left))}</b></div>
    ${meter(left / horizon, tone)}</div>`;
}

function usageOf(c, usage) {
  if (!usage) return null;
  const accounts = usage.accounts || {};
  if (Object.hasOwn(accounts, c.name)) return accounts[c.name];
  const named = Object.keys(accounts).length > 0;
  if (!c.active) return { [named ? "missing" : "passive"]: true, windows: [] };
  return named && !usage.windows.length && !usage.error ? { missing: true, windows: [] } : usage;
}

const skipped = {
  expired: "Its access token has expired, so TokenGauge waits for remuda to refresh it",
  unverified: "TokenGauge skips it until remuda identifies it again",
};

function windowsCell(c, usage, gaugeFound) {
  if (!gaugeFound) return "";
  usage = usageOf(c, usage);
  if (usage?.passive) return '<div class="aside">TokenGauge reports only the login in use</div>';
  if (usage?.missing) return '<div class="aside">No usage from TokenGauge for this login yet</div>';
  if (!usage) return '<div class="aside">No usage from TokenGauge for this CLI yet</div>';
  if (usage.behind) return '<div class="aside">TokenGauge has not updated since the switch to this login</div>';
  if (usage.error) return `<div class="aside late">TokenGauge: ${esc(usage.error)}</div>`;
  if (usage.credentialState)
    return `<div class="aside soon">${skipped[usage.credentialState] || `TokenGauge did not read it (${esc(usage.credentialState)})`}</div>`;
  if (!usage.windows.length) return '<div class="aside">No rate limits reported</div>';
  const why = usage.staleReason ? ` (${esc(usage.staleReason)})` : "";
  const stale = usage.stale ? `<div class="aside soon">TokenGauge could not update this${why}; figures may be old</div>` : "";
  return `<div class="windows">${usage.windows.map(windowCell).join("")}</div>${stale}`;
}

function row(c, usage, gaugeFound) {
  const unverified = c.verified === false;
  const spec = `${c.provider}/${c.name}`;
  const pills = [
    c.plan ? `<span class="pill">${esc(c.plan)}</span>` : "",
    c.active ? '<span class="pill on">In use</span>' : "",
    unverified ? '<span class="pill odd" title="Its sidecar was written for other tokens; remuda identifies it again on its next run">Unverified</span>' : "",
  ].join("");
  return `<div class="row${c.active ? " active" : ""}" data-spec="${esc(spec)}" data-provider="${esc(c.provider)}">
    <div class="who">
      <div><span class="spec">${esc(c.name)}</span><span class="label">${esc(c.label || "")}</span></div>
      <div class="mail">${esc(c.email)}</div>
      <div class="pills">${pills}</div>
    </div>
    <div class="usage">${windowsCell(c, usage, gaugeFound)}</div>
    <div class="tokens">
      ${lifetime("Access token", c.expiresAt, 8 * HOUR, HOUR)}
      ${lifetime("Sign-in lasts", c.refreshTokenExpiresAt, 30 * DAY, 3 * DAY)}
    </div>
    <div class="actions">
      <button class="btn go" data-act="use" ${c.active || unverified ? "disabled" : ""}>Use</button>
      <button class="btn icon" data-act="refresh" aria-label="Refresh ${esc(c.name)}" ${c.active ? 'disabled title="The CLI refreshes the login in use itself"' : unverified ? "disabled" : 'title="Refresh its tokens now"'}>${icon("refresh")}</button>
      <button class="btn icon" data-act="label" aria-label="Label ${esc(c.name)}" title="Label" ${unverified ? "disabled" : ""}>${icon("label")}</button>
      <button class="btn icon" data-act="rename" aria-label="Rename ${esc(c.name)}" title="Rename">${icon("rename")}</button>
      <button class="btn icon danger" data-act="remove" aria-label="Remove ${esc(c.name)}" ${c.active ? 'disabled title="Switch to another login first"' : 'title="Remove"'}>${icon("remove")}</button>
    </div>
  </div>`;
}

function liveNote(p, live) {
  if (!live) return "";
  const note = (html) => `<div class="note">${html}</div>`;
  if (live.state === "signed_out") return note(`${esc(p.name)} is signed out. Pick a login above to use it.`);
  if (live.state === "unreadable") return note(`Cannot read the ${esc(p.name)} login: ${esc(live.error)}`);
  if (live.state === "foreign")
    return note(`${esc(p.name)} is signed in with ${esc(live.what)}, which remuda cannot store. Using a stored login replaces it, after a second click, since it is dropped.`);
  if (live.state === "stored" && !live.confirmed)
    return note(`${esc(p.name)} looks signed into ${esc(live.name)}, but that could not be confirmed. Using another login asks first, since it would be dropped unsaved.`);
  if (live.state === "unstored")
    return note(`${esc(p.name)} is signed into ${esc(live.email || "an account")}, which remuda has not stored.
      <span class="inline"><input data-import-name="${esc(p.id)}" placeholder="Name to store it as">
      <button class="btn go" data-import="${esc(p.id)}">Import</button></span>`);
  return "";
}

function tile(p, creds, live, usage) {
  const active = creds.find((c) => c.active);
  const head = `<div class="tile-head"><b>${esc(p.name)}</b><span>${creds.length} login${creds.length === 1 ? "" : "s"}</span></div>`;
  const who = active ? `<span class="spec">${esc(active.name)}</span> in use`
    : live?.state === "unstored" ? "A login remuda has not stored is in use"
    : live?.state === "signed_out" ? "Signed out" : "No stored login in use";
  usage = active ? usageOf(active, usage) : usage;
  const windows = usage && !usage.error ? usage.windows : [];
  if (!windows.length) return `<div class="tile">${head}<div class="big">&ndash;<small>${
    usage?.behind ? "waiting for TokenGauge" : "no usage figures"}</small></div>
    <div class="under">${who}</div></div>`;
  const shown = windows.find((w) => w.title === picks[p.id])
    || windows.reduce((a, b) => (b.usedPercent > a.usedPercent ? b : a));
  const resets = shown.resetsAt ? `, resets ${esc(until(Date.parse(shown.resetsAt)))}` : "";
  const chips = windows.length < 2 ? "" : `<div class="picks" role="group" aria-label="Limit shown">${
    windows.map((w) => `<button data-provider="${esc(p.id)}" data-pick="${esc(w.title)}" aria-pressed="${w === shown}"
      title="${w.usedPercent}% used">${esc(w.title)}</button>`).join("")}</div>`;
  return `<div class="tile">${head}
    <div class="big">${shown.usedPercent}%<small>used, ${esc(shown.title)} limit</small></div>
    ${meter(shown.usedPercent / 100, usedTone(shown.usedPercent))}
    <div class="under">${who}${resets}</div>${chips}</div>`;
}

let problemsOpen = false;
function health(state) {
  const h = state.health || {};
  const items = [];
  const run = h.lastRefresh;
  const count = run?.problems?.length || 0;
  const problems = count
    ? `, <button class="linkish" id="problems-toggle" aria-expanded="${problemsOpen}" aria-controls="problems">${
        count} problem${count === 1 ? "" : "s"}</button>` : "";
  if (h.timer === "enabled") {
    const late = run && Date.now() - run.at > 75 * MIN;
    const tone = !run || late ? "warn" : run.problems.length ? "bad" : "good";
    const what = !run ? "Refresh timer on, it has not run yet"
      : `Refresh timer ran ${esc(ago(run.at))}, refreshed ${run.refreshed.length}`;
    items.push(`<div><span class="dot ${tone}"></span><span>${what}${problems}</span></div>`);
  } else if (h.timer === "masked") {
    items.push('<div><span class="dot warn"></span><span>Refresh timer masked: <code>systemctl --user unmask remuda-refresh.timer</code></span></div>');
  } else if (h.timer === "disabled") {
    items.push('<div><span class="dot warn"></span><span>Refresh timer installed but off: <code>systemctl --user enable --now remuda-refresh.timer</code></span></div>');
  } else {
    items.push('<div><span class="dot warn"></span><span>No refresh timer; spare logins stay fresh only when you press Refresh tokens</span></div>');
  }
  if (h.tokengauge) {
    const at = state.usage?.updatedAt;
    items.push(`<div><span class="dot good"></span><span>Usage from TokenGauge${at ? `, updated ${esc(ago(at))}` : ""}</span></div>`);
  } else {
    items.push('<div><span class="dot"></span><span>Install <a href="https://github.com/Arzaroth/TokenGauge" target="_blank" rel="noopener noreferrer">TokenGauge</a> to see usage here</span></div>');
  }
  items.push(`<div><span>Store <code>${esc(state.store)}</code></span></div>`);
  const list = count ? `<ul class="problems" id="problems"${problemsOpen ? "" : " hidden"}>${
    run.problems.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>` : "";
  return `<div class="health-line">${items.join("")}</div>${list}`;
}

function remembered(key) {
  try { return JSON.parse(localStorage.getItem(key)) ?? null; } catch { return null; }
}
function remember(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}
const picks = remembered("remuda-tiles") || {};

let loaded = false, groups = [];
const liveOf = (provider) => groups.find((g) => g.p.id === provider)?.live;
const dropsLive = (live) => live?.state === "foreign" || live?.state === "unstored"
  || (live?.state === "stored" && !live.confirmed);
const taken = (provider, name) => groups.some((g) => g.p.id === provider && g.creds.some((c) => c.name === name));
function overwrite(provider, name) {
  const c = groups.find((g) => g.p.id === provider)?.creds.find((c) => c.name === name);
  return `Overwrite ${name}${c?.email ? ` (${c.email})` : ""}?`;
}
function dropping(live) {
  if (live.state === "unstored") return `Drop ${live.email || "the live login"} unsaved?`;
  if (live.state === "foreign") return `Drop the ${live.what.replace(/^an? /, "")}?`;
  return `Lose ${live.name}'s newest tokens?`;
}
function behind(state, id) {
  const u = state.usage;
  if (u?.updatedAt == null || Object.keys(u.providers?.[id]?.accounts || {}).length) return false;
  return u.updatedAt < (state.health?.switchedAt?.[id] ?? 0);
}

let loads = 0;
async function load() {
  const seq = ++loads;
  let state;
  try {
    state = await api("/api/state");
    if (seq !== loads) return;
  } catch (e) {
    if (seq !== loads) return;
    $("providers").innerHTML = `<div class="note">${esc(e.message)}. Open the link remuda printed when it started.</div>`;
    return;
  }
  const select = $("add-provider");
  if (!select.options.length)
    select.innerHTML = state.providers.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
  const gaugeFound = !!state.health?.tokengauge;
  document.body.classList.toggle("fresh", loaded);
  $("health").innerHTML = health(state);
  groups = state.providers.map((p) => ({
    p,
    creds: state.credentials.filter((c) => c.provider === p.id),
    live: state.live.find((l) => l.provider === p.id),
    usage: behind(state, p.id) ? { behind: true, windows: [] } : state.usage?.providers?.[p.id] || null,
  }));
  drawStrip();
  const open = editors.get(document.querySelector("#providers .editing")?.closest(".row"));
  $("providers").innerHTML = groups.map(({ p, creds, live, usage }) => `<section class="group">
      <div class="group-head"><h2>${esc(p.name)}</h2><span class="count">${creds.length}</span></div>
      ${creds.length ? creds.map((c) => row(c, usage, gaugeFound)).join("")
        : `<div class="empty">No stored ${esc(p.name)} logins. Import the one in use or add an account below.</div>`}
      ${liveNote(p, live)}</section>`).join("");
  if (open) reopen(open);
  loaded = true;
}

document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter" || ev.isComposing || !ev.target.matches(".inline input")) return;
  ev.preventDefault();
  ev.target.closest(".inline").querySelector(".btn.go")?.click();
});

$("providers").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button");
  if (!btn) return;
  if (btn.dataset.import) {
    const input = document.querySelector(`[data-import-name="${btn.dataset.import}"]`);
    const provider = btn.dataset.import, name = input.value.trim();
    if (!name) return input.focus();
    const force = taken(provider, name);
    if (force && !ask(btn, overwrite(provider, name), `${provider}/${name}`)) return;
    return act("/api/import", { provider, name, force });
  }
  const r = btn.closest(".row");
  const spec = r?.dataset.spec;
  if (!spec) return;
  switch (btn.dataset.act) {
    case "save": return save(r);
    case "use": {
      const live = liveOf(r.dataset.provider);
      const discard = dropsLive(live);
      if (discard && !ask(btn, dropping(live), spec)) return;
      return act("/api/use", { name: spec, discard });
    }
    case "refresh": return act("/api/refresh", { name: spec, force: true });
    case "remove":
      if (!ask(btn, "Remove for good?")) return;
      return act("/api/remove", { name: spec });
    case "label":
    case "rename": {
      const open = editors.get(r);
      if (open?.btn === btn) return leave(r);
      if (open && !leave(r)) return;
      edit(r, btn, spec);
    }
  }
});

const editors = new WeakMap();

function edit(r, btn, spec) {
  const rename = btn.dataset.act === "rename";
  const shown = r.querySelector(rename ? ".spec" : ".label");
  const original = shown.textContent;
  const box = document.createElement("span");
  box.className = rename ? "editing" : "editing edit-label";
  box.innerHTML = `<input class="edit${rename ? " spec" : ""}"><button class="ok" data-act="save" aria-label="Save" title="Save (Enter)">${icon("save")}</button>`;
  const input = box.firstChild;
  input.value = original;
  input.placeholder = rename ? "Name" : "Label";
  input.setAttribute("aria-label", rename ? `New name for ${original}` : `Label for ${spec}`);
  shown.replaceWith(box);
  btn.setAttribute("aria-pressed", "true");
  editors.set(r, { btn, box, input, shown, original, rename, spec });
  input.focus();
  input.select();
  input.onkeydown = (e) => {
    if (e.key === "Enter") save(r);
    if (e.key === "Escape") leave(r);
  };
}

function reopen({ spec, btn, input }) {
  const r = document.querySelector(`#providers [data-spec="${CSS.escape(spec)}"]`);
  const again = r?.querySelector(`[data-act="${btn.dataset.act}"]`);
  if (!again || again.disabled) return;
  edit(r, again, spec);
  const e = editors.get(r);
  e.input.value = input.value;
  e.input.setSelectionRange(input.value.length, input.value.length);
}

function ask(btn, text, what = "") {
  if (btn.dataset.armed && btn.armedFor === what) return Date.now() - btn.armedAt > 400;
  disarm(btn);
  arm(btn, text, what);
  return false;
}

function arm(btn, text, what = "") {
  btn.original ??= btn.innerHTML;
  btn.armedFor = what;
  btn.armedAt = Date.now();
  btn.dataset.armed = "1";
  btn.classList.add("armed");
  btn.textContent = text;
  btn.disarm = setTimeout(() => disarm(btn), 4000);
}

function disarm(btn) {
  clearTimeout(btn.disarm);
  delete btn.dataset.armed;
  btn.classList.remove("armed");
  if (btn.original != null) btn.innerHTML = btn.original;
  delete btn.original;
}

function closeEditor(r) {
  const e = editors.get(r);
  disarm(e.btn);
  e.btn.removeAttribute("aria-pressed");
  e.box.replaceWith(e.shown);
  editors.delete(r);
}

function leave(r) {
  const e = editors.get(r);
  const changed = e.input.value.trim() !== e.original.trim();
  if (!changed || ask(e.btn, "Discard?")) {
    closeEditor(r);
    return true;
  }
  e.input.focus();
  return false;
}

function save(r) {
  const e = editors.get(r);
  const value = e.rename ? e.input.value.trim() : e.input.value;
  if (value.trim() === e.original.trim()) return closeEditor(r);
  closeEditor(r);
  return e.rename
    ? act("/api/rename", { name: e.spec, to: value })
    : act("/api/label", { name: e.spec, text: value });
}

function drawStrip() {
  $("strip").innerHTML = `<div class="strip">${groups.map((g) => tile(g.p, g.creds, g.live, g.usage)).join("")}</div>`;
}

$("strip").addEventListener("click", (ev) => {
  const chip = ev.target.closest("[data-pick]");
  if (!chip) return;
  picks[chip.dataset.provider] = chip.dataset.pick;
  remember("remuda-tiles", picks);
  const g = groups.find((g) => g.p.id === chip.dataset.provider);
  chip.closest(".tile").outerHTML = tile(g.p, g.creds, g.live, g.usage);
  document.querySelector(`[data-provider="${CSS.escape(chip.dataset.provider)}"][aria-pressed="true"]`)?.focus();
});

$("health").addEventListener("click", (ev) => {
  if (!ev.target.closest("#problems-toggle")) return;
  problemsOpen = !problemsOpen;
  $("problems").hidden = !problemsOpen;
  $("problems-toggle").setAttribute("aria-expanded", problemsOpen);
});

function setTheme(theme) {
  if (theme === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;
  try { localStorage.setItem("remuda-theme", theme); } catch {}
  for (const b of $("theme").children) b.setAttribute("aria-pressed", b.dataset.theme === theme);
}
setTheme(document.documentElement.dataset.theme || "auto");
$("theme").addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-theme]");
  if (b) setTheme(b.dataset.theme);
});

$("refresh-all").onclick = () => act("/api/refresh", {});

let openLogin = null;
$("add").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const provider = $("add-provider").value, name = $("add-name").value.trim();
  const go = $("add").querySelector("[type=submit]");
  const force = taken(provider, name);
  if (force && !ask(go, overwrite(provider, name), `${provider}/${name}`)) return;
  disarm(go);
  const box = $("signin");
  if (openLogin) await api("/api/login/cancel", { id: openLogin }).catch(() => {});
  let login;
  try {
    login = await api("/api/login", { provider, name, force });
  } catch (e) {
    return toast(e.message, true);
  }
  openLogin = login.id;
  if (!login.opened) window.open(login.url, "_blank", "noopener");
  const tail = login.needsCode
    ? '<div class="inline"><input id="code" placeholder="Paste the code the sign-in page shows"><button class="btn go" id="finish">Finish sign-in</button><button class="btn" id="cancel">Cancel</button></div>'
    : '<div class="inline"><span class="aside">Waiting for the browser to finish signing in&hellip;</span><button class="btn" id="cancel">Cancel</button></div>';
  const link = `<a href="${esc(login.url)}" target="_blank" rel="noopener">open the sign-in page</a>`;
  const copy = '<button type="button" class="linkish" id="copy-link">copy its link</button>';
  const where = login.opened
    ? `A private window opened for it, so the account you are signed into here stays put.
      If it did not appear, ${copy} into a private window.`
    : `A private window keeps the account you are signed into out of the way: ${copy} into one.
      If no tab opened, ${link}.`;
  box.innerHTML = `<div class="signin"><div>Sign in with the account to store as <b>${esc(name)}</b>.
    ${where}</div>${tail}</div>`;
  $("copy-link").onclick = () => navigator.clipboard.writeText(login.url)
    .then(() => toast("Sign-in link copied"), () => toast("Could not copy the link", true));
  const done = async (code) => {
    try {
      const r = await api("/api/login/finish", { id: login.id, code });
      toast(r.message);
      box.innerHTML = "";
      $("add-name").value = "";
    } catch (e) {
      if (openLogin === login.id) toast(e.message, true);
    }
    if (openLogin === login.id) openLogin = null;
    load();
  };
  $("cancel").onclick = async () => {
    openLogin = null;
    box.innerHTML = "";
    await api("/api/login/cancel", { id: login.id }).catch(() => {});
  };
  if (login.needsCode) {
    $("finish").onclick = () => done($("code").value);
    $("code").focus();
  } else {
    done(undefined);
  }
});

function reload() {
  const editing = document.querySelector("#providers .edit")
    || document.activeElement?.closest?.("#providers")
    || document.querySelector("#providers [data-armed]");
  if (!editing) load();
}

const changes = new BroadcastChannel("remuda-changes");
changes.onmessage = reload;
function changed() {
  changes.postMessage(null);
  reload();
}

async function follow() {
  let wait = 1000, again = false;
  for (;;) {
    try {
      const r = await fetch("/api/events", { headers: { "X-Remuda-Token": token } });
      if (r.status === 401) return;
      if (r.ok) {
        wait = 1000;
        if (again) changed();
        again = true;
        const events = r.body.pipeThrough(new TextDecoderStream()).getReader();
        for (let buf = "", chunk; !(chunk = await events.read()).done; ) {
          const parts = (buf + chunk.value).split("\n\n");
          buf = parts.pop();
          if (parts.some((e) => e.split("\n").includes("data: changed"))) changed();
        }
      }
    } catch {}
    await new Promise((done) => setTimeout(done, wait));
    wait = Math.min(wait * 2, 30000);
  }
}

load();
// Browsers allow a handful of connections per host across all tabs, so one
// tab holds the stream and tells the others.
if (navigator.locks) navigator.locks.request("remuda-events", follow);
else follow();
setInterval(reload, 60000);
</script>
</body>
</html>
