[package]
name = "remuda"
version = "0.9.0"
edition = "2024"
rust-version = "1.89"
description = "Keep several Claude Code and Codex logins and switch between them"
license = "MIT OR WTFPL"
repository = "https://github.com/Arzaroth/remuda"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "form", "json", "rustls"] }
selvedge = { git = "https://github.com/Arzaroth/selvedge", tag = "v0.3.2" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[dev-dependencies]
mockito = "1"
tempfile = "3"
