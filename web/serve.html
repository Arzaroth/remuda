<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>remuda</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
document.documentElement.dataset.skin = "sage";
try {
  const t = localStorage.getItem("remuda-theme");
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  const asked = new URLSearchParams(location.search).get("skin");
  if (asked === "sage" || asked === "instrument") localStorage.setItem("remuda-skin", asked);
  const k = localStorage.getItem("remuda-skin");
  document.documentElement.dataset.skin = k === "instrument" ? "instrument" : "sage";
} catch {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
