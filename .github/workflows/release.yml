name: Release

on:
  push:
    tags:
      - 'v*'
  # A rehearsal: everything a tag would build and check, published nowhere. A
  # tag is never moved, so the first run of a changed release must not be the
  # one that ships.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/install.sh'
      - 'scripts/package.sh'
      - 'scripts/arch.sh'
      - 'scripts/check-package.sh'
      - 'packaging/**'
      - 'systemd/**'
      - 'Cargo.toml'
      - 'build.rs'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REF: ${{ github.event.inputs.tag || github.ref }}
  PUBLISH: ${{ github.event_name != 'pull_request' }}
  NFPM_VERSION: 2.47.0
  NFPM_SHA256: 3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97

jobs:
  # Static musl: the C rustls compiles against the runner's glibc asked for
  # 2.39, and the binary would not start on Debian 12 or Ubuntu 22.04.
  binary:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      # The tag being released, or on a pull request the one Cargo.toml's
      # version would be tagged as.
      - name: The tag
        run: |
          if [[ $PUBLISH == true ]]; then
            echo "REF_NAME=${REF#refs/tags/}" >>"$GITHUB_ENV"
          else
            echo "REF_NAME=v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)" >>"$GITHUB_ENV"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install the page's dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Test
        run: cargo test --locked

      - name: musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add "$TARGET"

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Check the binary is static, runs and agrees with the tag
        run: |
          binary="target/$TARGET/release/remuda"
          if readelf -d "$binary" | grep -q NEEDED; then
            readelf -d "$binary"
            echo "::error::the binary links a shared library"
            exit 1
          fi
          printed=$("$binary" --version)
          echo "$printed"
          if [[ $printed != "remuda ${REF_NAME#v}" ]]; then
            echo "::error::tag $REF_NAME does not match the binary's version ($printed)"
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remuda-${{ matrix.arch }}
          path: target/${{ env.TARGET }}/release/remuda
          if-no-files-found: error

  assets:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: The tag
        run: |
          if [[ $PUBLISH == true ]]; then
            echo "REF_NAME=${REF#refs/tags/}" >>"$GITHUB_ENV"
          else
            echo "REF_NAME=v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)" >>"$GITHUB_ENV"
          fi

      - name: Install nfpm
        run: |
          deb="nfpm_${NFPM_VERSION}_amd64.deb"
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/$deb"
          echo "$NFPM_SHA256  $deb" | sha256sum -c -
          sudo dpkg -i "$deb"

      - name: Download the binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: binaries

      - name: Package
        run: |
          safe="${REF_NAME//[^A-Za-z0-9._-]/_}"
          mkdir -p dist completions
          # The scripts are the same for every architecture, so the runner's
          # own binary writes them.
          chmod +x binaries/remuda-x86_64/remuda
          binaries/remuda-x86_64/remuda completions bash >completions/remuda.bash
          binaries/remuda-x86_64/remuda completions zsh >completions/_remuda
          binaries/remuda-x86_64/remuda completions fish >completions/remuda.fish
          for arch in x86_64 aarch64; do
            stage="pack/$arch"
            rm -rf "$stage"
            mkdir -p "$stage/systemd"
            install -m 755 "binaries/remuda-$arch/remuda" "$stage/remuda"
            cp systemd/* "$stage/systemd/"
            cp -r completions "$stage/"
            cp LICENSE LICENSE-MIT LICENSE-WTFPL "$stage/"
            tar -czf "dist/remuda-$safe-linux-$arch.tar.gz" -C "$stage" .
            # The .deb and .rpm, from the archive rather than beside it, so a
            # package and `--update` install the same bytes.
            scripts/package.sh "dist/remuda-$safe-linux-$arch.tar.gz" dist
          done
          ls -l dist

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-assets
          path: dist/*
          if-no-files-found: error

  # makepkg needs an Arch system. The -bin package repackages the archives the
  # job above made; the source one is built to prove its PKGBUILD, and only
  # that PKGBUILD ships.
  arch:
    needs: assets
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed base-devel pacman-contrib cargo git nodejs pnpm

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: The tag
        run: |
          if [[ $PUBLISH == true ]]; then
            echo "REF_NAME=${REF#refs/tags/}" >>"$GITHUB_ENV"
          else
            echo "REF_NAME=v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)" >>"$GITHUB_ENV"
          fi

      - name: The release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-assets
          path: dist

      - name: Build the packages
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${REF_NAME#v}"
          safe="${REF_NAME//[^A-Za-z0-9._-]/_}"
          git config --global --add safe.directory "$PWD"
          if [[ $PUBLISH == true ]]; then
            curl -fsSL "https://github.com/$REPOSITORY/archive/refs/tags/$REF_NAME.tar.gz" -o source.tar.gz
          else
            git archive --prefix="remuda-$version/" HEAD -o source.tar.gz
          fi
          useradd -m builder
          chown -R builder .
          su builder -c "scripts/arch.sh bin $version dist"
          su builder -c "scripts/arch.sh source $version dist source.tar.gz"
          mkdir -p out
          cp dist/remuda-bin-*.pkg.tar.zst out/
          tar -czf "out/remuda-$safe-pkgbuild.tar.gz" -C dist/arch .

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-arch
          path: out/*
          if-no-files-found: error

  checksums:
    needs: [assets, arch]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # Signing starts the day packaging/remuda.asc is committed, and from then
      # on a release without the key behind it refuses to publish. A pull
      # request never sees the secret, so its rehearsal stays unsigned.
      - name: Signing key
        id: key
        env:
          KEY: ${{ env.PUBLISH == 'true' && secrets.REMUDA_GPG_KEY || '' }}
          PASSPHRASE: ${{ env.PUBLISH == 'true' && secrets.REMUDA_GPG_PASSPHRASE || '' }}
        run: |
          fpr=""
          if [[ -f packaging/remuda.asc ]]; then
            fpr="$(gpg --show-keys --with-colons packaging/remuda.asc | awk -F: '/^fpr/ { print $10; exit }')"
          fi
          if [[ -z "$KEY" ]]; then
            if [[ -n "$fpr" && "$PUBLISH" == true ]]; then
              echo "::error::packaging/remuda.asc is committed, so a release needs the REMUDA_GPG_KEY secret"
              exit 1
            fi
            echo "No signing key in this run: the packages stay unsigned"
            exit 0
          fi
          if [[ -z "$fpr" ]]; then
            echo "::error::REMUDA_GPG_KEY is set but packaging/remuda.asc, its public half, is not committed"
            exit 1
          fi
          printf '%s' "$PASSPHRASE" >"$RUNNER_TEMP/passphrase"
          printf '%s\n' "$KEY" | gpg --batch --import
          if ! gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10 }' | grep -qx "$fpr"; then
            echo "::error::REMUDA_GPG_KEY is not the key packaging/remuda.asc publishes ($fpr)"
            exit 1
          fi
          sudo apt-get install -qq -y rpm >/dev/null
          echo "fpr=$fpr" >>"$GITHUB_OUTPUT"

      - name: Sign the packages
        if: steps.key.outputs.fpr
        env:
          FPR: ${{ steps.key.outputs.fpr }}
        run: |
          cd dist
          rpmsign --addsign \
            --define "__gpg $(command -v gpg)" \
            --define "_gpg_name $FPR" \
            --define "_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase-file $RUNNER_TEMP/passphrase" \
            -- *.rpm
          for pkg in *.pkg.tar.zst; do
            gpg --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/passphrase" \
              --local-user "$FPR" --detach-sign --no-armor --output "$pkg.sig" "$pkg"
          done
          cp ../packaging/remuda.asc remuda-release-key.asc

      # What scripts/install.sh checks a download against before running it,
      # taken once every asset is in and signed.
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        if: steps.key.outputs.fpr
        env:
          FPR: ${{ steps.key.outputs.fpr }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/passphrase" \
            --local-user "$FPR" --armor --detach-sign --output dist/SHA256SUMS.asc dist/SHA256SUMS
          rm -f "$RUNNER_TEMP/passphrase"

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  # Every package installed on a distribution that has never seen this tree,
  # before anything is published: the oldest glibc anyone is likely to run it
  # on, and each package manager's own idea of what a package should hold.
  verify:
    needs: checksums
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            deb: amd64
            rpm: x86_64
            pkg: x86_64
          # No archlinux image for arm64.
          - runs-on: ubuntu-24.04-arm
            deb: arm64
            rpm: aarch64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist

      - name: The checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: The signatures
        if: hashFiles('dist/SHA256SUMS.asc') != ''
        env:
          PKG: ${{ matrix.pkg }}
          RPM: ${{ matrix.rpm }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          gpg --batch --import packaging/remuda.asc
          gpg --batch --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          docker run --rm -e RPM -v "$PWD/dist:/d:ro" fedora:latest sh -ec '
            rpm --import /d/remuda-release-key.asc
            rpm -K /d/remuda-*."$RPM".rpm | tee /dev/stderr | grep -q "signatures OK"'
          if [[ -n $PKG ]]; then
            fpr=$(gpg --show-keys --with-colons packaging/remuda.asc | awk -F: '/^fpr/ { print $10; exit }')
            docker run --rm -e PKG -e FPR="$fpr" -v "$PWD/dist:/d:ro" archlinux:latest sh -ec '
              pacman-key --init >/dev/null 2>&1
              pacman-key --add /d/remuda-release-key.asc >/dev/null
              pacman-key --lsign-key "$FPR" >/dev/null
              for pkg in /d/remuda-bin-*-"$PKG".pkg.tar.zst; do
                pacman-key --verify "$pkg.sig" "$pkg"
              done'
          fi

      - name: The .deb on Debian 12 and Ubuntu 22.04
        env:
          DEB: ${{ matrix.deb }}
        run: |
          for image in debian:12 ubuntu:22.04; do
            docker run --rm -e DEB -v "$PWD/dist:/d:ro" -v "$PWD/scripts:/s:ro" "$image" sh -ec '
              apt-get update -qq >/dev/null
              apt-get install -qq -y /d/remuda_*_"$DEB".deb >/dev/null
              sh /s/check-package.sh
              apt-get remove -qq -y remuda >/dev/null
              test ! -e /usr/bin/remuda'
          done

      - name: The .rpm on Fedora
        env:
          RPM: ${{ matrix.rpm }}
        run: |
          docker run --rm -e RPM -v "$PWD/dist:/d:ro" -v "$PWD/scripts:/s:ro" fedora:latest sh -ec '
            rpm -i /d/remuda-*."$RPM".rpm
            rpm -V remuda
            sh /s/check-package.sh
            rpm -e remuda
            test ! -e /usr/bin/remuda'

      - name: The Arch package
        if: matrix.pkg
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          fpr=""
          if [[ -f dist/remuda-release-key.asc ]]; then
            fpr=$(gpg --show-keys --with-colons dist/remuda-release-key.asc | awk -F: '/^fpr/ { print $10; exit }')
          fi
          docker run --rm -e PKG -e FPR="$fpr" -v "$PWD/dist:/d:ro" -v "$PWD/scripts:/s:ro" archlinux:latest sh -ec '
            sed -i "/^NoExtract/d" /etc/pacman.conf
            if [ -n "$FPR" ]; then
              pacman-key --init >/dev/null 2>&1
              pacman-key --add /d/remuda-release-key.asc >/dev/null
              pacman-key --lsign-key "$FPR" >/dev/null
            fi
            pacman -U --noconfirm /d/remuda-bin-*-"$PKG".pkg.tar.zst >/dev/null
            pacman -Qkk remuda-bin
            sh /s/check-package.sh'

      - name: install.sh
        run: |
          home=$(mktemp -d)
          HOME=$home REMUDA_DOWNLOAD_BASE="$PWD/dist" bash -s -- --no-timer --no-completions <scripts/install.sh
          "$home/.local/bin/remuda" --version

  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist

      - name: Extract release notes from CHANGELOG
        env:
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          awk -v hdr="## [$version]" '
            index($0, hdr) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md >release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::warning::No CHANGELOG.md section for $version - falling back to auto-generated notes."
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.sig
            dist/*.asc
            dist/SHA256SUMS
